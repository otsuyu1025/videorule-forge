services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    volumes:
      - uploads:/app/data/uploads
      - logs:/app/data/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads:
  logs:
